name: Build XStream Native

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-xstream-native.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build ARM64 APK
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out build harness
        uses: actions/checkout@v4

      - name: Check out pinned XStreaming source
        shell: bash
        run: |
          git clone https://github.com/Geocld/XStreaming.git XStreaming
          cd XStreaming
          git checkout 383e19d324f2d3029d1c304752f4d38a9360bb95
          git rev-parse HEAD

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable Yarn
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@4.2.2 --activate
          yarn --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.1.7779620" \
            "cmake;3.22.1"

      - name: Apply XStream Native v0.1 changes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_xstream.py
          python3 /tmp/patch_xstream.py
          git -C XStreaming status --short
          git -C XStreaming diff --check

      - name: Install JavaScript dependencies
        working-directory: XStreaming
        shell: bash
        run: yarn install --immutable

      - name: Configure Android SDK path
        shell: bash
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > XStreaming/android/local.properties

      - name: Build XStream Native ARM64 release
        working-directory: XStreaming/android
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          chmod +x gradlew
          ./gradlew assembleProdRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -Pkotlin.compiler.execution.strategy=in-process \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=512m" \
            --stacktrace

      - name: Verify and stage APK
        shell: bash
        run: |
          APK="$(find XStreaming/android/app/build/outputs/apk -type f -name '*.apk' | grep '/prod/release/' | head -n 1)"
          test -n "$APK"
          cp "$APK" XStream-Native-v0.1-arm64.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose XStream-Native-v0.1-arm64.apk
          {
            echo "XStream Native v0.1"
            echo "Upstream commit: 383e19d324f2d3029d1c304752f4d38a9360bb95"
            echo
            "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging XStream-Native-v0.1-arm64.apk | head -n 8
            echo
            sha256sum XStream-Native-v0.1-arm64.apk
            echo
            echo "Native ABIs:"
            unzip -l XStream-Native-v0.1-arm64.apk | awk '/lib\/[^/]+\/.*\.so$/ {print $4}' | cut -d/ -f2 | sort -u
          } | tee build-info.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XStream-Native-v0.1-arm64
          path: |
            XStream-Native-v0.1-arm64.apk
            build-info.txt
          if-no-files-found: error
          retention-days: 30
